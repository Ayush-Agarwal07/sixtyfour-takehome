[project]
name = "people-research-agent"
version = "0.1.0"
description = "People research agent — freeform target in, structured provenance-carrying profile out."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "instructor>=1.0",
  "openai>=1.30",
  "tenacity>=8.2",
  "httpx>=0.27",
  "trafilatura>=1.8",
  "selectolax>=0.3",
  "extruct>=0.16",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sse-starlette>=2.0",
  "aiofiles>=23.2",
  "python-dotenv>=1.0",
  "diskcache>=5.6",
  "orjson>=3.9",
  "nameparser>=1.1",
  "unidecode>=1.3",
  "nicknames>=0.2",
  "rapidfuzz>=3.6",
  "dateparser>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "pandas>=2.2"]

[project.scripts]
pi = "pi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
